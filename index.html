<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Temporarily Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(60% 60% at 20% 18%, rgba(96,150,214,.20), transparent 70%),
      radial-gradient(52% 52% at 82% 74%, rgba(245,206,138,.10), transparent 70%),
      #0A1524;
    color: #F2F6FC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: grid; place-items: center; text-align: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .in { max-width: 420px; }
  .cn { font-size: clamp(28px, 7vw, 44px); font-weight: 700; letter-spacing: .08em; }
  .en { margin-top: 16px; font-size: 10px; letter-spacing: .36em; color: #8B9CB2; text-transform: uppercase; }
  .line { margin: 32px auto 0; width: 64px; height: 1px; background: rgba(255,255,255,.20); }
  .note { margin: 26px 0 0; font-size: 13px; color: #8B9CB2; line-height: 1.9; }
</style>
</head>
<body>
  <div class="in">
    <div class="cn">暂时关闭</div>
    <div class="en">Temporarily Offline</div>
    <div class="line"></div>
    <p class="note">网站正在调整中，稍后重新开放。</p>
  </div>
</body>
</html>
